
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Functions</title>
</head>
<body>

<script>

// Function to add two numbers
function add(a, b) {
    return a + b;
}

let result = add(10, 20);
console.log("Sum:", result);


// Closures
function outer() {
    let count = 0;

    function inner() {
        count++;
        console.log(count);
    }

    return inner;
}

let counter = outer();

counter();
counter();
counter();


// IIFE
(function () {
    console.log("Hello, JavaScript!");
})();


// Map
let numbers1 = [1, 2, 3, 4, 5];

let doubled = numbers1.map(function (num) {
    return num * 2;
});

console.log("Doubled:", doubled);


// Filter
let numbers2 = [1, 2, 3, 4, 5, 6];

let evenNumbers = numbers2.filter(function (num) {
    return num % 2 === 0;
});

console.log("Even Numbers:", evenNumbers);


// Reduce
let numbers3 = [10, 20, 30, 40, 50];

let sum = numbers3.reduce(function (total, num) {
    return total + num;
}, 0);

console.log("Total Sum:", sum);


// ForEach
numbers3.forEach(function (num) {
    console.log(num);
});

</script>

</body>
</html>
